name: Source check

# Weekly: reread the page behind every fact, update what changed, and open a pull request so a
# person reviews every change before it counts. Needs the ANTHROPIC_API_KEY repository secret and
# "Allow GitHub Actions to create and approve pull requests" turned on in the repo settings.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Whether the key is set, without handing the key itself to every step (like pnpm install).
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Skip without an API key
        if: ${{ env.HAS_KEY != 'true' }}
        run: echo "ANTHROPIC_API_KEY isn't set for this repository, so there is nothing to check."

      - name: Check sources
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm check:sources --apply --limit 25

      - name: Open a pull request
        if: ${{ env.HAS_KEY == 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: data/source-check
          title: "data: weekly source check"
          commit-message: "data: weekly source check"
          body-path: reports/source-check-latest.md
          add-paths: data/options/*.json
